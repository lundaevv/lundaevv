<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0d1117"/>
  <rect width="1200" height="400" fill="url(#scanlines)"/>

  <!-- Left dog -->
  <g font-family="'Courier New',Courier,monospace" font-size="16" fill="#484f58">
    <text x="30" y="152">   /\_____/\</text>
    <text x="30" y="174">  / o     o \</text>
    <text x="30" y="196"> |  (-----)  |</text>
    <text x="30" y="218"> |   \___/   |</text>
    <text x="30" y="240">  \_________/</text>
    <text x="30" y="262">   /  | |  \</text>
    <text x="30" y="284">  (_) | | (_)</text>
  </g>

  <!-- Right dog -->
  <g font-family="'Courier New',Courier,monospace" font-size="16" fill="#484f58">
    <text x="1022" y="152">   /\_____/\</text>
    <text x="1022" y="174">  / o     o \</text>
    <text x="1022" y="196"> |  (-----)  |</text>
    <text x="1022" y="218"> |   \___/   |</text>
    <text x="1022" y="240">  \_________/</text>
    <text x="1022" y="262">   /  | |  \</text>
    <text x="1022" y="284">  (_) | | (_)</text>
  </g>

  <!-- Terminal window -->
  <rect x="205" y="48" width="790" height="318" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="205" y="48" width="790" height="36" rx="10" fill="#21262d"/>
  <rect x="205" y="66" width="790" height="18" fill="#21262d"/>

  <!-- Traffic lights -->
  <circle cx="231" cy="66" r="7" fill="#ff5f57"/>
  <circle cx="254" cy="66" r="7" fill="#febc2e"/>
  <circle cx="277" cy="66" r="7" fill="#28c840"/>

  <!-- Title bar text -->
  <text x="600" y="71" font-family="'Courier New',Courier,monospace" font-size="12" fill="#6e7681" text-anchor="middle">vitali@hive — bash</text>

  <!-- Terminal content -->
  <g font-family="'Courier New',Courier,monospace" font-size="15">

    <!-- $ whoami -->
    <text x="232" y="118" fill="#3fb950">$</text>
    <text x="246" y="118" fill="#8b949e"> whoami</text>
    <text x="232" y="142" fill="#e6edf3">vitali</text>

    <!-- $ cat stack.txt -->
    <text x="232" y="178" fill="#3fb950">$</text>
    <text x="246" y="178" fill="#8b949e"> cat stack.txt</text>

    <!-- C  ·  C++ -->
    <text x="232" y="208" fill="#79c0ff">C</text>
    <text x="241" y="208" fill="#484f58">  ·  </text>
    <text x="286" y="208" fill="#79c0ff">C++</text>

    <!-- Python  ·  JavaScript  ·  TypeScript -->
    <text x="232" y="238" fill="#3fb950">Python</text>
    <text x="286" y="238" fill="#484f58">  ·  </text>
    <text x="331" y="238" fill="#f0db4f">JavaScript</text>
    <text x="421" y="238" fill="#484f58">  ·  </text>
    <text x="466" y="238" fill="#4c9be8">TypeScript</text>

    <!-- Node.js  ·  PostgreSQL -->
    <text x="232" y="268" fill="#68a063">Node.js</text>
    <text x="295" y="268" fill="#484f58">  ·  </text>
    <text x="340" y="268" fill="#4484b2">PostgreSQL</text>

    <!-- cursor -->
    <text x="232" y="316" fill="#3fb950">$</text>
    <rect x="246" y="302" width="9" height="17" fill="#3fb950" opacity="0.85"/>
  </g>
</svg>
